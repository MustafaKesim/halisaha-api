<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakip Bul — Yeşil Vadi Halı Saha</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="nav-container"></div>

    <div class="container page-wrap">
        <div class="section-header">
            <h2>Rakip Arayan Takımlar</h2>
        </div>
        <p class="muted text-sm mt-0">Bir takımın meydan okumasını kabul et, otomatik olarak maç oluşsun. Kabul ettiğin maçları <a href="/reservations.html">Maçlarım</a> sayfasında görebilirsin.</p>
        <div id="list-area"></div>
    </div>

    <div id="accept-modal" style="display:none; position:fixed; inset:0; background:rgba(11,61,30,0.45); align-items:center; justify-content:center; z-index:100;">
        <div class="card" style="max-width:380px; width:90%;">
            <h3>Meydan Okumayı Kabul Et</h3>
            <div id="accept-alert"></div>
            <div class="field">
                <label>Hangi takımınla kabul edeceksin?</label>
                <select id="accept-team-select"></select>
            </div>
            <div class="flex gap-8">
                <button class="btn btn-outline btn-block" onclick="closeAcceptModal()">Vazgeç</button>
                <button class="btn btn-primary btn-block" id="accept-submit">Kabul Et</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        requireAuth();
        document.getElementById('nav-container').innerHTML = renderNavbar('open-challenges');

        async function loadChallenges() {
            const area = document.getElementById('list-area');
            try {
                const challenges = await api.get('/api/open-challenges');

                if (challenges.length === 0) {
                    area.innerHTML = `<div class="empty-state"><span class="ball">⚽</span>Şu an rakip arayan bir takım yok.</div>`;
                    return;
                }

                area.innerHTML = `<div class="grid grid-cards">${challenges.map(c => `
                    <div class="card">
                        <div class="flex-between">
                            <div class="card-title">${escapeHtml(c.teamName)}</div>
                            <span class="badge badge-open">Rakip Arıyor</span>
                        </div>
                        <div class="card-meta">${escapeHtml(c.venueName)} · ${formatDate(c.date)} · ${formatTime(c.startTime)} - ${formatTime(c.endTime)}</div>
                        <p class="text-sm">${c.teamSize}'e${c.teamSize} maç aranıyor</p>
                        <div class="card-row">
                            <button class="btn btn-primary btn-block" onclick="openAcceptModal(${c.id})">Meydan Okumayı Kabul Et</button>
                        </div>
                    </div>
                `).join('')}</div>`;
            } catch (err) {
                area.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
            }
        }

        let activeChallengeId = null;

        async function openAcceptModal(challengeId) {
            activeChallengeId = challengeId;
            document.getElementById('accept-alert').innerHTML = '';
            const select = document.getElementById('accept-team-select');
            select.innerHTML = '<option>Yükleniyor...</option>';
            document.getElementById('accept-modal').style.display = 'flex';

            try {
                const teams = await api.get('/api/teams/me');
                if (teams.length === 0) {
                    select.innerHTML = '<option value="">Önce bir takım oluşturmalısın</option>';
                    return;
                }
                select.innerHTML = teams.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
            } catch (err) {
                document.getElementById('accept-alert').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
            }
        }

        function closeAcceptModal() {
            document.getElementById('accept-modal').style.display = 'none';
        }

        document.getElementById('accept-submit').addEventListener('click', async () => {
            const teamId = document.getElementById('accept-team-select').value;
            if (!teamId) return;
            try {
                const match = await api.post(`/api/open-challenges/${activeChallengeId}/accept`, { challengerTeamId: Number(teamId) });
                closeAcceptModal();
                showAlert(`Maç oluştu! ${match.homeTeamName} vs ${match.awayTeamName}`, 'success');
                loadChallenges();
            } catch (err) {
                document.getElementById('accept-alert').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
            }
        });

        loadChallenges();
    </script>
</body>
</html>
