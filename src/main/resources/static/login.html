<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap — Yeşil Vadi Halı Saha</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="ball">⚽</span>
                <h1>Yeşil Vadi Halı Saha</h1>
                <p class="muted">Hesabına giriş yap</p>
            </div>

            <div id="alert-box"></div>

            <form id="login-form">
                <div class="field">
                    <label for="email">E-posta</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Giriş Yap</button>
            </form>

            <div class="auth-switch">
                Hesabın yok mu? <a href="/register.html">Kayıt ol</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (getToken()) {
            window.location.href = '/venues.html';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('submit-btn');
            alertBox.innerHTML = '';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Giriş yapılıyor...';

            try {
                const response = await api.post('/api/users/login', { email, password });
                saveSession(response.token, { id: response.userId, email: response.email, fullName: response.fullName });
                window.location.href = '/venues.html';
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Giriş Yap';
            }
        });
    </script>
</body>
</html>
