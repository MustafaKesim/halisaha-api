<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol — Yeşil Vadi Halı Saha</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="ball">⚽</span>
                <h1>Yeşil Vadi Halı Saha</h1>
                <p class="muted">Yeni bir hesap oluştur</p>
            </div>

            <div id="alert-box"></div>

            <form id="register-form">
                <div class="field">
                    <label for="fullName">Ad Soyad</label>
                    <input type="text" id="fullName" required autocomplete="name">
                </div>
                <div class="field">
                    <label for="email">E-posta</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" minlength="6" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Kayıt Ol</button>
            </form>

            <div class="auth-switch">
                Zaten hesabın var mı? <a href="/login.html">Giriş yap</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (getToken()) {
            window.location.href = '/venues.html';
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('submit-btn');
            alertBox.innerHTML = '';

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Kayıt olunuyor...';

            try {
                await api.post('/api/users/register', { email, password, fullName });
                const loginResponse = await api.post('/api/users/login', { email, password });
                saveSession(loginResponse.token, { id: loginResponse.userId, email: loginResponse.email, fullName: loginResponse.fullName });
                window.location.href = '/venues.html';
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Kayıt Ol';
            }
        });
    </script>
</body>
</html>
