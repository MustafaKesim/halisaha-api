spring.application.name=HaliSahaApi

# Gizli degerler (DB_PASSWORD, JWT_SECRET) icin varsayilan YOK: ortam degiskeni ile
# verilmeli. Local gelistirmede bunlar git'e girmeyen config/application.properties
# dosyasindan gelir (config/application.properties.example'a bak).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/halisaha}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.rate-limit.login.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.rate-limit.login.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
